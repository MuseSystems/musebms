          # Run tests for all business components
          ./tools/build_tools/msbms_build.exs --base-dir ${{ env.MSBMS_BASEDIR }} --test --ci

  test_subsystems:
    runs-on: ubuntu-latest
    env:
      MSBMS_BASEDIR: ./app_server/subsystems
      MSBMS_JOBNAME: subsystems-${{ matrix.otp }}-${{ matrix.elixir }}

    strategy:
      matrix:
